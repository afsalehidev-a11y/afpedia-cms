name: PHP CI
on:
  push:
    branches: [main, migration/php-laravel-final]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        database: ['mysql', 'mariadb']
    services:
      database:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.0' || 'mariadb:10.6' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: afpedia_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: afpedia_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: afpedia_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo, pdo_mysql, tokenizer, xml, ctype, curl
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run test suite against real database
        run: vendor/bin/phpunit
