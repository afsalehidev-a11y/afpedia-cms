name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AFPedia.CMS.slnx

      - name: Build
        run: dotnet build AFPedia.CMS.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AFPedia.CMS.slnx --no-build --configuration Release
