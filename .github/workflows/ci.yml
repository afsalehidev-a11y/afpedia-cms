name: PHP CI
on:
  push:
    branches: [main, migration/php-laravel-final]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        database: ['mysql', 'mariadb']
    services:
      database:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.0' || 'mariadb:10.6' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: afpedia_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: afpedia_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: afpedia_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo, pdo_mysql, tokenizer, xml, ctype, curl
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run test suite against real database
        run: vendor/bin/phpunit

  aspnet-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo, pdo_sqlite, sqlite3, tokenizer, xml, ctype, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Generate a hash with the actual ASP.NET Identity implementation
        shell: bash
        run: |
          mkdir -p /tmp/afpedia-identity-fixture
          cat > /tmp/afpedia-identity-fixture/Interop.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.Extensions.Identity.Core" Version="10.0.0" />
            </ItemGroup>
          </Project>
          EOF
          cat > /tmp/afpedia-identity-fixture/Program.cs <<'EOF'
          using Microsoft.AspNetCore.Identity;

          const string password = "AFPedia-Interop-Password-2026";
          var hasher = new PasswordHasher<object>();
          Console.WriteLine(hasher.HashPassword(new object(), password));
          EOF
          hash="$(dotnet run --project /tmp/afpedia-identity-fixture/Interop.csproj --configuration Release --verbosity quiet | tail -n 1)"
          test -n "$hash"
          echo "ASPNET_IDENTITY_V3_FIXTURE=$hash" >> "$GITHUB_ENV"
      - name: Verify real .NET hash in PHP
        run: vendor/bin/phpunit tests/Unit/Identity/AspNetIdentityPasswordHasherTest.php
